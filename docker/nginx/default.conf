server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Custom MIME types for assets nginx doesn't know by default
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Defense-in-depth header set at edge. The authoritative value lives in the
    # Laravel SecurityHeaders middleware (X-Frame-Options DENY etc.) — we keep
    # nginx silent on those to avoid duplicates with conflicting values.
    add_header X-XSS-Protection "0" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 256;

    # Health endpoint - bypass PHP, hit Laravel /up directly
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass wf-app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        internal;
    }

    # Don't expose dotfiles or hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Don't run any other PHP file directly (security)
    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
